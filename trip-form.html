<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Trip</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="add" data-auth="required" data-area="user" data-title="addTitle">
  <div id="site-header"></div>
  <main>
    <div class="wrap">
      <form class="panel form-card form-wide" id="trip-form" novalidate>
        <h1 id="form-title" data-i18n="addTitle" style="margin-bottom:16px"></h1>
        <div class="alert alert-error" id="err" hidden></div>

        <div class="field"><label for="f-title" data-i18n="fTitle"></label><input id="f-title" required></div>
        <div class="field"><label for="f-dest" data-i18n="fDest"></label><select id="f-dest" required></select></div>
        <div class="row2">
          <div class="field"><label for="f-start" data-i18n="fStart"></label><input id="f-start" type="date" required></div>
          <div class="field"><label for="f-end" data-i18n="fEnd"></label><input id="f-end" type="date" required></div>
        </div>
        <div class="row2">
          <div class="field"><label for="f-travelers" data-i18n="fTravelers"></label><input id="f-travelers" type="number" min="1" value="1"></div>
          <div class="field"><label for="f-budget" data-i18n="fBudget"></label><input id="f-budget" type="number" min="0" step="1" value="0"></div>
        </div>
        <div class="field">
          <label for="f-itin" data-i18n="fItin"></label>
          <textarea id="f-itin" rows="6"></textarea>
          <div class="hint" data-i18n="itinHint"></div>
        </div>
        <div class="field"><label for="f-notes" data-i18n="fNotes"></label><textarea id="f-notes"></textarea></div>

        <div class="btn-row left">
          <button class="btn btn-primary" type="submit" data-i18n="save"></button>
          <a class="btn btn-outline" id="cancel" href="trips.html" data-i18n="cancel"></a>
        </div>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var editId = TP.params().get('id');
    var existing = editId ? TP.getTrip(editId) : null;

    // Switch the page to "Edit" mode when an existing trip is being edited
    if (existing) {
      document.body.dataset.page = 'edit';
      document.body.dataset.title = 'editTitle';
      $('form-title').dataset.i18n = 'editTitle';
      $('cancel').href = 'trip.html?id=' + existing.id;
    }

    // Destination list is rebuilt on language change, keeping the chosen value
    window.render = function () {
      var sel = $('f-dest'), cur = sel.value || (existing && existing.dest) || TP.params().get('dest') || TP.DESTS[0].id;
      sel.innerHTML = TP.DESTS.map(function (d) {
        return '<option value="' + d.id + '"' + (d.id === cur ? ' selected' : '') + '>' + TP.esc(TP.pick(d.name)) + '</option>';
      }).join('');
    };

    if (editId && !existing) {
      document.querySelector('main .wrap').innerHTML = '<div class="empty"><p class="muted" data-i18n="notFound"></p><a class="btn btn-primary" href="trips.html" data-i18n="navTrips"></a></div>';
      window.render = null;
    } else if (existing) {
      $('f-title').value = existing.title;
      $('f-start').value = existing.start;
      $('f-end').value = existing.end;
      $('f-travelers').value = existing.travelers;
      $('f-budget').value = existing.budget;
      $('f-itin').value = existing.itinerary || '';
      $('f-notes').value = existing.notes || '';
    }

    TP.init();

    var form = $('trip-form');
    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      var err = $('err'), title = $('f-title').value.trim(), start = $('f-start').value, end = $('f-end').value;
      var fail = function (key) { err.dataset.i18n = key; err.hidden = false; TP.applyI18n(); };
      if (!title || !start || !end) return fail('errRequired');
      if (end < start) return fail('errDates');
      var trip = {
        id: existing ? existing.id : TP.newId(),
        title: title, dest: $('f-dest').value, start: start, end: end,
        travelers: Math.max(1, parseInt($('f-travelers').value, 10) || 1),
        budget: Math.max(0, Number($('f-budget').value) || 0),
        itinerary: $('f-itin').value, notes: $('f-notes').value.trim(),
        createdAt: existing ? existing.createdAt : Date.now()
      };
      TP.saveTrip(trip);
      location.href = 'trip.html?id=' + trip.id;
    });
  </script>
</body>
</html>
