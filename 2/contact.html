<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact" data-title="navContact">
  <div id="site-header"></div>
  <main>
    <section class="page-head"><div class="wrap">
      <h1 data-i18n="contactTitle"></h1>
      <p class="muted" data-i18n="contactSub"></p>
    </div></section>

    <section class="section"><div class="wrap contact-grid">
      <form class="panel" id="contact-form" novalidate>
        <div class="alert alert-ok" id="ok" hidden data-i18n="sentOk"></div>
        <div class="alert alert-error" id="err" hidden data-i18n="errRequired"></div>
        <div class="row2">
          <div class="field"><label for="c-name" data-i18n="fName"></label><input id="c-name" required></div>
          <div class="field"><label for="c-email" data-i18n="fEmail"></label><input id="c-email" type="email" required></div>
        </div>
        <div class="row2">
          <div class="field"><label for="c-phone" data-i18n="fPhone"></label><input id="c-phone" type="tel"></div>
          <div class="field"><label for="c-subject" data-i18n="fSubject"></label><input id="c-subject"></div>
        </div>
        <div class="field"><label for="c-msg" data-i18n="fMessage"></label><textarea id="c-msg" required></textarea></div>
        <button class="btn btn-primary" type="submit" data-i18n="send"></button>
      </form>

      <aside class="panel">
        <h3 data-i18n="contactInfo"></h3>
        <ul class="info-list">
          <li><span>📍</span><span data-i18n="address"></span></li>
          <li><span>✉️</span><span>hello@example.com</span></li>
          <li><span>📞</span><span>+855 12 345 678</span></li>
        </ul>
      </aside>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
  <script>
    TP.init();
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = function (id) { return document.getElementById(id).value.trim(); };
      var ok = document.getElementById('ok'), err = document.getElementById('err');
      ok.hidden = true; err.hidden = true;
      if (!v('c-name') || !/^\S+@\S+\.\S+$/.test(v('c-email')) || !v('c-msg')) { err.hidden = false; return; }
      var list = TP.store.get('tp_messages', []);
      list.push({ name: v('c-name'), email: v('c-email'), phone: v('c-phone'), subject: v('c-subject'), message: v('c-msg'), at: new Date().toISOString() });
      TP.store.set('tp_messages', list);
      e.target.reset();
      ok.hidden = false;
    });
  </script>
</body>
</html>
