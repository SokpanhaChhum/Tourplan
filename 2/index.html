<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TourPlanner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="home" data-title="navHome">
    <div id="site-header"></div>
    <main id="main"></main>
    <div id="site-footer"></div>
    <script src="app.js"></script>
    <script>
      window.render = function () {
        var T = TP.t,
          logged = !!TP.user();
        document.getElementById("main").innerHTML =
          '<section class="hero"><div class="wrap">' +
          "<h1>" +
          T("heroTitle") +
          "</h1><p>" +
          T("heroSub") +
          "</p>" +
          '<div class="btn-row"><a class="btn btn-light" href="destinations.html">' +
          T("btnExplore") +
          "</a>" +
          '<a class="btn btn-outline" style="color:#fff;border-color:#fff" href="' +
          (logged ? "trip-form.html" : "login.html") +
          '">' +
          T("btnStart") +
          "</a></div>" +
          "</div></section>" +
          '<section class="section"><div class="wrap">' +
          '<div class="section-head"><h2>' +
          T("featured") +
          '</h2><a class="link-more" href="destinations.html">' +
          T("viewAll") +
          " →</a></div>" +
          '<div class="grid">' +
          TP.DESTS.slice(0, 3).map(TP.destCard).join("") +
          "</div>" +
          "</div></section>" +
          '<section class="section" style="background:#fff"><div class="wrap">' +
          '<h2 class="center" style="margin-bottom:24px">' +
          T("whyTitle") +
          "</h2>" +
          '<div class="grid">' +
          '<div class="card feature"><div class="icon">🗺️</div><h3>' +
          T("why1t") +
          '</h3><p class="muted">' +
          T("why1d") +
          "</p></div>" +
          '<div class="card feature"><div class="icon">📝</div><h3>' +
          T("why2t") +
          '</h3><p class="muted">' +
          T("why2d") +
          "</p></div>" +
          '<div class="card feature"><div class="icon">💰</div><h3>' +
          T("why3t") +
          '</h3><p class="muted">' +
          T("why3d") +
          "</p></div>" +
          "</div></div></section>" +
          (logged
            ? ""
            : '<section class="cta"><div class="wrap"><h2>' +
              T("ctaTitle") +
              "</h2><p>" +
              T("ctaSub") +
              "</p>" +
              '<a class="btn btn-light" href="login.html?tab=signup">' +
              T("btnSignup") +
              "</a></div></section>");
      };
      TP.init();
    </script>
  </body>
</html>
