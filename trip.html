<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="trip" data-auth="required" data-area="user" data-title="tripDetails">
  <div id="site-header"></div>
  <main><div class="wrap section" id="main"></div></main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
  <script>
    window.render = function () {
      var T = TP.t, id = TP.params().get('id'), tr = TP.getTrip(id), main = document.getElementById('main');
      if (!tr) {
        main.innerHTML = '<div class="empty"><p class="muted">' + T('notFound') + '</p><a class="btn btn-primary" href="trips.html">' + T('navTrips') + '</a></div>';
        return;
      }
      var d = TP.destById(tr.dest), s = TP.tripStatus(tr);
      var lines = (tr.itinerary || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);

      main.innerHTML =
        '<a class="back" style="margin-top:0" href="trips.html">' + T('back') + '</a>' +
        '<div class="section-head" style="margin-top:12px">' +
          '<div><h1>' + TP.esc(tr.title) + '</h1>' + TP.badge(s) + '</div>' +
          '<div class="btn-row">' +
            '<a class="btn btn-outline" href="trip-form.html?id=' + tr.id + '">' + T('edit') + '</a>' +
            '<button class="btn btn-danger" id="del">' + T('del') + '</button>' +
          '</div></div>' +
        '<div class="detail-grid">' +
          '<div>' +
            '<div class="panel"><h3>' + T('fItin') + '</h3>' +
              (lines.length
                ? '<ol class="itin">' + lines.map(function (l) { return '<li>' + TP.esc(l) + '</li>'; }).join('') + '</ol>'
                : '<p class="muted">' + T('noItin') + '</p>') +
            '</div>' +
            (tr.notes ? '<div class="panel"><h3>' + T('fNotes') + '</h3><p style="white-space:pre-wrap">' + TP.esc(tr.notes) + '</p></div>' : '') +
          '</div>' +
          '<div class="panel"><ul class="info-list">' +
            '<li><span class="muted">' + T('fDest') + '</span><strong>' + (d ? d.emoji + ' ' + TP.esc(TP.pick(d.name)) : '-') + '</strong></li>' +
            '<li><span class="muted">' + T('fStart') + '</span><strong>' + TP.fmtDate(tr.start) + '</strong></li>' +
            '<li><span class="muted">' + T('fEnd') + '</span><strong>' + TP.fmtDate(tr.end) + '</strong></li>' +
            '<li><span class="muted">' + T('duration') + '</span><strong>' + TP.numDays(tr.start, tr.end) + ' ' + T('days') + '</strong></li>' +
            '<li><span class="muted">' + T('fTravelers') + '</span><strong>' + (Number(tr.travelers) || 1) + '</strong></li>' +
            '<li><span class="muted">' + T('fBudget') + '</span><strong>' + TP.money(tr.budget) + '</strong></li>' +
          '</ul></div>' +
        '</div>';

      document.getElementById('del').addEventListener('click', function () {
        if (confirm(T('confirmDel'))) { TP.deleteTrip(tr.id); location.href = 'trips.html'; }
      });
    };
    TP.init();
  </script>
</body>
</html>
