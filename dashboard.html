<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard" data-auth="required" data-area="user" data-title="navDashboard">
  <div id="site-header"></div>
  <main><div class="wrap section" id="main"></div></main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
  <script>
    window.render = function () {
      var T = TP.t, u = TP.user(), trips = TP.allTrips(), main = document.getElementById('main');
      var upcoming = trips.filter(function (x) { return TP.tripStatus(x) !== 'done'; })
                          .sort(function (a, b) { return a.start < b.start ? -1 : 1; });
      var budget = trips.reduce(function (s, x) { return s + (Number(x.budget) || 0); }, 0);
      var recent = trips.slice().reverse().slice(0, 3);

      var next = upcoming.length
        ? TP.tripCard(upcoming[0])
        : '<div class="panel empty"><p class="muted">' + T('noUpcoming') + '</p></div>';

      var recentHtml = recent.length
        ? '<div class="grid">' + recent.map(TP.tripCard).join('') + '</div>'
        : '<div class="panel empty"><p class="muted">' + T('noTrips') + '</p><a class="btn btn-primary" href="trip-form.html">' + T('createFirst') + '</a></div>';

      main.innerHTML =
        '<h1>' + T('welcome') + ' ' + TP.esc(u.name) + '</h1>' +
        '<div class="stats">' +
          '<div class="stat"><div class="muted">' + T('statTotal') + '</div><div class="num">' + trips.length + '</div></div>' +
          '<div class="stat"><div class="muted">' + T('statUp') + '</div><div class="num">' + upcoming.length + '</div></div>' +
          '<div class="stat"><div class="muted">' + T('statBudget') + '</div><div class="num">' + TP.money(budget) + '</div></div>' +
        '</div>' +
        '<div class="btn-row left" style="margin-bottom:32px">' +
          '<a class="btn btn-primary" href="trip-form.html">+ ' + T('navAdd') + '</a>' +
          '<a class="btn btn-outline" href="destinations.html">' + T('navDest') + '</a></div>' +
        '<h2 style="margin-bottom:12px">' + T('nextTrip') + '</h2>' +
        '<div class="grid" style="margin-bottom:32px">' + next + '</div>' +
        '<div class="section-head"><h2>' + T('recent') + '</h2>' +
          (trips.length ? '<a class="link-more" href="trips.html">' + T('viewAll') + ' →</a>' : '') + '</div>' +
        recentHtml;
    };

    document.getElementById('main').addEventListener('click', function (e) {
      var id = e.target.dataset && e.target.dataset.del;
      if (id && confirm(TP.t('confirmDel'))) { TP.deleteTrip(id); window.render(); }
    });
    TP.init();
  </script>
</body>
</html>
